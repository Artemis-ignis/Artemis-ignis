<svg xmlns="http://www.w3.org/2000/svg" width="620" height="88" viewBox="0 0 620 88" role="img" aria-labelledby="title desc">
  <title id="title">Artemis-Ignis platform badges</title>
  <desc id="desc">Windows 10 and 11, .NET 8, AutoHotkey v2, and MIT license badges.</desc>
  <defs>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" x2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" x2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <filter id="softShadow" x="-8%" y="-20%" width="116%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="620" height="88" rx="14" fill="#0b0f18"/>
  <g filter="url(#softShadow)" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.5">
    <g transform="translate(22 18)">
      <rect width="176" height="34" rx="8" fill="#2b2f36"/>
      <rect x="92" width="84" height="34" rx="8" fill="url(#blue)"/>
      <path d="M92 0h10v34H92z" fill="#2b2f36"/>
      <text x="17" y="23" fill="#fff">Windows</text>
      <text x="108" y="23" fill="#fff">10 | 11</text>
    </g>
    <g transform="translate(214 18)">
      <rect width="106" height="34" rx="8" fill="#2b2f36"/>
      <rect x="58" width="48" height="34" rx="8" fill="url(#violet)"/>
      <path d="M58 0h10v34H58z" fill="#2b2f36"/>
      <text x="15" y="23" fill="#fff">.NET</text>
      <text x="76" y="23" fill="#fff">8</text>
    </g>
    <g transform="translate(336 18)">
      <rect width="202" height="34" rx="8" fill="#2b2f36"/>
      <rect x="150" width="52" height="34" rx="8" fill="url(#green)"/>
      <path d="M150 0h10v34h-10z" fill="#2b2f36"/>
      <text x="15" y="23" fill="#fff">AutoHotkey</text>
      <text x="169" y="23" fill="#fff">v2</text>
    </g>
    <g transform="translate(22 54)">
      <rect width="134" height="28" rx="7" fill="#2b2f36"/>
      <rect x="72" width="62" height="28" rx="7" fill="url(#ink)"/>
      <path d="M72 0h9v28h-9z" fill="#2b2f36"/>
      <text x="16" y="20" fill="#fff" font-size="16">License</text>
      <text x="91" y="20" fill="#fff" font-size="16">MIT</text>
    </g>
  </g>
</svg>
